name: Import FreshTrack cloud UI (manual only)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Import existing public FreshTrack UI
        run: python3 scripts/import_freshtrack_ui.py
      - name: Test and build the FreshTrack UI
        run: |
          cd freshtrack-app
          node --check app.js
          node --check build.js
          npm test
          npm run build
